[project]
name = "gitpulse"
version = "1.0.0"
description = "Discord bot and GitHub App that posts repository activity to Discord"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
