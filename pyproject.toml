[project]
name = "gitpulse"
version = "1.0.0"
description = "Discord bot and GitHub App that posts repository activity to Discord"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # raised inside discord.utils on Python 3.13+, not our code
    "ignore:'count' is passed as positional argument:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
